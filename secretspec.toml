[project]
name = "smith-wiki"
revision = "1.0"

[profiles.default]
FIRECRAWL_API_KEY = { description = "Firecrawl API key used by sw fetch to scrape sources" }
R2_ACCOUNT_ID = { description = "Cloudflare account ID that owns the capture bucket" }
R2_BUCKET = { description = "Private R2 bucket for source captures", default = "smith-wiki-captures" }
R2_ACCESS_KEY_ID = { description = "R2 API token access key ID with read and write access to the bucket" }
R2_SECRET_ACCESS_KEY = { description = "R2 API token secret access key" }
