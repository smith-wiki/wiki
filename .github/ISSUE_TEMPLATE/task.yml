name: Wiki task
description: Queue a topical research request, research-process task, maintenance task, or site change for an agent.
title: "[Task] "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        Write this issue so an agent can complete it without access to the originating conversation. Use English in all fields.

  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      description: Choose the page or repository workflow this task primarily affects.
      options:
        - Source ingest
        - Research question
        - Note exploration
        - Research process
        - Wiki maintenance
        - Site change
    validations:
      required: true

  - type: input
    id: research_milestone
    attributes:
      label: Research milestone
      description: Required only for a topical research turn. Use the existing research milestone name or URL explicitly supplied by the user, or the new milestone created for that turn. Leave blank for process and other non-research work.
      placeholder: https://github.com/owner/repository/milestone/N

  - type: input
    id: process_milestone
    attributes:
      label: Process milestone
      description: Optional for operational research-process work. Use the dedicated process-development milestone when the task is being grouped there. Leave blank for topical research.
      placeholder: https://github.com/owner/repository/milestone/N

  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: Optional preceding Issue or pull request URL when this work is stacked or otherwise blocked.
      placeholder: https://github.com/owner/repository/pull/N

  - type: textarea
    id: request
    attributes:
      label: Request
      description: State the work directly. Include the question to answer or behavior to change.
      placeholder: Describe the task in complete, implementation-independent terms.
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: Inputs and sources
      description: Add source URLs, issue links, files, or other evidence. Put one URL per line.
      placeholder: https://example.com/source

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this matters and what an agent must know before starting.
      placeholder: Current state, motivation, and relevant prior decisions.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that distinguish done from incomplete.
      placeholder: |
        - [ ] First observable result
        - [ ] Second observable result
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Record boundaries, compatibility requirements, and work that is explicitly out of scope.
      placeholder: Keep existing routes stable; do not add a new runtime dependency.

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: Queue only records the task. Implement now authorizes an agent to create the issue and continue immediately.
      options:
        - Queue only
        - Implement now
    validations:
      required: true

  - type: checkboxes
    id: handoff
    attributes:
      label: Handoff readiness
      options:
        - label: This issue contains enough context and acceptance criteria for another agent to execute it without the originating chat.
          required: true
